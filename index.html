<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thailand Trip 2026</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* [KEEPING ALL YOUR ORIGINAL STYLES UNCHANGED] */
        :root { --primary: #023047; --secondary: #219ebc; --accent: #fb8500; --bg: #f8fafc; --white: #ffffff; --text-light: #64748b; }
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: var(--bg); color: #334155; margin: 0; padding-bottom: 50px; }
        .hero { background: linear-gradient(rgba(2, 48, 71, 0.6), rgba(2, 48, 71, 0.4)), url('https://static.vecteezy.com/system/resources/previews/008/316/012/non_2x/aerial-view-of-phi-phi-island-with-maya-bay-and-phi-leh-lake-krabi-province-top-view-of-a-rocky-tropical-island-isolated-with-turquoise-water-and-white-beach-thailand-free-photo.jpg'); background-size: cover; background-position: center; height: 550px; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; padding: 20px; position: relative; }
        .clock-container { position: absolute; top: 30px; display: flex; gap: 15px; width: 100%; justify-content: center; flex-wrap: wrap; }
        .clock-bubble { background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(8px); padding: 10px 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.3); text-align: center; min-width: 100px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .clock-bubble .label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; opacity: 0.9; margin-bottom: 2px; display: block; }
        .clock-bubble .time { font-size: 1.1rem; font-weight: 700; font-variant-numeric: tabular-nums; }
        .hero h1 { font-size: 4rem; margin: 60px 0 0 0; letter-spacing: 6px; font-weight: 800; text-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .hero p { font-size: 1.3rem; font-weight: 300; margin-top: 10px; letter-spacing: 1px; }
        .countdown { margin-top: 30px; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px); padding: 15px 30px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.2); }
        .countdown h3 { margin: 0 0 5px; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2px; opacity: 0.9; }
        .countdown-timer { font-size: 1.8rem; font-weight: 700; font-variant-numeric: tabular-nums; }
        .container { max-width: 800px; margin: -80px auto 0; padding: 0 20px; position: relative; z-index: 10; }
        .quick-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: var(--white); padding: 15px; border-radius: 12px; text-align: center; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05); border-bottom: 4px solid var(--accent); }
        .stat-card i { color: var(--secondary); font-size: 1.2rem; margin-bottom: 5px; }
        .stat-card div { font-weight: bold; color: var(--primary); }
        .main-list { background: var(--white); border-radius: 16px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08); overflow: hidden; min-height: 200px;}
        .list-item { display: grid; grid-template-columns: 90px 1fr auto; align-items: center; padding: 25px; border-bottom: 1px solid #f1f5f9; transition: all 0.2s ease; }
        .date-box { text-align: center; padding-right: 20px; border-right: 2px solid #f1f5f9; display: flex; flex-direction: column; justify-content: center; }
        .date-box .day { font-size: 1.8rem; font-weight: 800; color: var(--primary); line-height: 1; }
        .date-box .month { font-size: 0.75rem; text-transform: uppercase; color: var(--text-light); font-weight: 600; margin-top: 4px; }
        .activity-details { padding: 0 25px; }
        .activity-details h4 { font-size: 1.15rem; color: var(--primary); margin: 0 0 5px 0; display: flex; align-items: center; gap: 10px; }
        .activity-details h4 i { color: var(--accent); font-size: 0.9rem; }
        .activity-details p { margin: 4px 0; color: var(--text-light); font-size: 0.95rem; line-height: 1.4; }
        .price-tag { background: #dcfce7; color: #166534; padding: 8px 12px; border-radius: 8px; font-size: 0.9rem; font-weight: 700; white-space: nowrap; }
        .loading { padding: 40px; text-align: center; color: var(--text-light); }
        @media (max-width: 600px) { .list-item { grid-template-columns: 70px 1fr; } .price-tag { grid-column: 2; justify-self: start; } }
    </style>
</head>
<body>
    <div class="hero">
        <div class="clock-container">
            <div class="clock-bubble"><span class="label">Knoxville</span><div class="time" id="time-knox">--:--</div></div>
            <div class="clock-bubble"><span class="label">Doha</span><div class="time" id="time-doha">--:--</div></div>
            <div class="clock-bubble"><span class="label">Phuket</span><div class="time" id="time-phuket">--:--</div></div>
        </div>
        <h1>PHUKET</h1>
        <p>MARCH 5 — MARCH 17, 2026</p>
        <div class="countdown">
            <h3>Countdown</h3>
            <div class="countdown-timer" id="countdown">Loading...</div>
        </div>
    </div>

    <div class="container">
        <div class="quick-stats">
            <div class="stat-card"><i class="fas fa-calendar-alt"></i><div>12 Days</div></div>
            <div class="stat-card"><i class="fas fa-plane"></i><div>4 Flights</div></div>
            <div class="stat-card"><i class="fas fa-umbrella-beach"></i><div>5 Beaches</div></div>
        </div>

        <div class="main-list" id="itinerary-list">
            <div class="loading">Fetching your itinerary...</div>
        </div>
    </div>

    <script>
        // REPLACE THIS URL with your "Published to Web" CSV link
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS_CnsbDUPOjrATctJ5byGVkKLOrjBuv3mwvMVcaLVKI03faBrL7GOHMX3a8n5SzMfLrgrtrZoIB-xG/pub?output=csv';

        async function fetchItinerary() {
            try {
                const response = await fetch(sheetUrl);
                const data = await response.text();
                const rows = data.split('\n').slice(1); // Skip header row
                
                const listContainer = document.getElementById('itinerary-list');
                listContainer.innerHTML = ''; // Clear loading

                rows.forEach(row => {
                    // Simple CSV parser (split by comma, handling potential quotes is better but let's keep it simple)
                    const columns = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    if (columns.length < 4) return;

                    const [day, month, icon, title, desc, price] = columns.map(c => c.replace(/"/g, '').trim());

                    const itemHtml = `
                        <div class="list-item">
                            <div class="date-box">
                                <span class="day">${day}</span>
                                <span class="month">${month}</span>
                            </div>
                            <div class="activity-details">
                                <h4><i class="fas ${icon}"></i> ${title}</h4>
                                <p>${desc.split(';').join('</p><p>')}</p>
                            </div>
                            ${price ? `<div class="price-tag">${price}</div>` : ''}
                        </div>
                    `;
                    listContainer.innerHTML += itemHtml;
                });
            } catch (error) {
                console.error('Error fetching sheet:', error);
                document.getElementById('itinerary-list').innerHTML = '<div class="loading">Failed to load data. Make sure your sheet is "Published to Web" as CSV.</div>';
            }
        }

        // --- CLOCK & COUNTDOWN LOGIC (REMAINING THE SAME) ---
        const targetDate = new Date("2026-03-05T00:00:00").getTime();
        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;
            if (distance < 0) { document.getElementById("countdown").innerHTML = "Welcome to Thailand!"; return; }
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);
            document.getElementById("countdown").innerHTML = `${days}d ${hours}h ${minutes}m ${seconds}s`;
        }
        function updateClocks() {
            const now = new Date();
            const formatTime = (tz) => now.toLocaleTimeString('en-US', { timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: true });
            document.getElementById("time-knox").innerText = formatTime('America/New_York');
            document.getElementById("time-doha").innerText = formatTime('Asia/Qatar');
            document.getElementById("time-phuket").innerText = formatTime('Asia/Bangkok');
        }

        setInterval(() => { updateCountdown(); updateClocks(); }, 1000);
        updateCountdown();
        updateClocks();
        fetchItinerary();
    </script>
</body>
</html>
