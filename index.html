<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thailand Trip 2026</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #023047;
            --secondary: #219ebc;
            --accent: #fb8500;
            --bg: #f8fafc;
            --white: #ffffff;
            --text-light: #64748b;
            --check-green: #22c55e;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: #334155;
            margin: 0;
            padding-bottom: 80px; /* Space for nav */
        }

        /* HERO SECTION */
        .hero {
            background: linear-gradient(rgba(2, 48, 71, 0.6), rgba(2, 48, 71, 0.4)),
                url('https://static.vecteezy.com/system/resources/previews/008/316/012/non_2x/aerial-view-of-phi-phi-island-with-maya-bay-and-phi-leh-lake-krabi-province-top-view-of-a-rocky-tropical-island-isolated-with-turquoise-water-and-white-beach-thailand-free-photo.jpg');
            background-size: cover;
            background-position: center;
            height: 550px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 20px;
            position: relative;
        }

        .clock-container {
            position: absolute;
            top: 30px;
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        .clock-bubble {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            padding: 8px 15px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.3);
            text-align: center;
            min-width: 80px;
        }

        .clock-bubble .label { font-size: 0.6rem; text-transform: uppercase; display: block; }
        .clock-bubble .time { font-size: 1rem; font-weight: 700; }

        .hero h1 { font-size: 3.5rem; margin: 40px 0 0 0; letter-spacing: 5px; font-weight: 800; }

        .countdown {
            margin-top: 30px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 12px 25px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .countdown-timer { font-size: 1.5rem; font-weight: 700; }

        /* CONTENT CONTAINERS */
        .container {
            max-width: 800px;
            margin: -60px auto 0;
            padding: 0 15px;
            position: relative;
            z-index: 10;
        }

        .main-list {
            background: var(--white);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            margin-bottom: 30px;
        }

        /* ITINERARY ITEMS */
        .list-item {
            display: grid;
            grid-template-columns: 80px 1fr auto;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid #f1f5f9;
        }

        .date-box { text-align: center; border-right: 2px solid #f1f5f9; padding-right: 15px; }
        .date-box .day { font-size: 1.5rem; font-weight: 800; color: var(--primary); display: block; }
        .date-box .month { font-size: 0.7rem; text-transform: uppercase; color: var(--text-light); }

        .activity-details { padding: 0 20px; }
        .activity-details h4 { margin: 0 0 5px 0; font-size: 1.1rem; color: var(--primary); }
        .activity-details p { margin: 3px 0; font-size: 0.9rem; color: var(--text-light); }

        .price-tag {
            background: #dcfce7;
            color: #166534;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
        }
        .free-tag { background: #fee2e2; color: #991b1b; }

        /* CHECKLIST STYLES */
        .check-grid {
            display: grid;
            grid-template-columns: 1fr repeat(4, 50px);
            padding: 15px;
            border-bottom: 1px solid #f1f5f9;
            align-items: center;
        }
        .check-header { background: #f8fafc; font-weight: bold; font-size: 0.75rem; text-align: center; text-transform: uppercase; }
        .check-header div:first-child { text-align: left; }
        .status-icon { text-align: center; font-size: 1.2rem; }
        .fa-check-circle { color: var(--check-green); }
        .fa-circle { color: #e2e8f0; }

        /* BOTTOM NAV */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--white);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.05);
            z-index: 1000;
        }
        .nav-btn {
            border: none;
            background: none;
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
            flex: 1;
        }
        .nav-btn.active { color: var(--accent); }
        .nav-btn i { font-size: 1.2rem; }

        .loading { padding: 40px; text-align: center; color: var(--text-light); }

        @media (max-width: 600px) {
            .list-item { grid-template-columns: 60px 1fr; }
            .price-tag { grid-column: 2; justify-self: start; margin-top: 10px; }
            .hero h1 { font-size: 2.5rem; }
            .check-grid { grid-template-columns: 1fr repeat(4, 40px); font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <div id="itinerary-page">
        <div class="hero">
            <div class="clock-container">
                <div class="clock-bubble"><span class="label">Knoxville</span><div class="time" id="time-knox">--:--</div></div>
                <div class="clock-bubble"><span class="label">Doha</span><div class="time" id="time-doha">--:--</div></div>
                <div class="clock-bubble"><span class="label">Phuket</span><div class="time" id="time-phuket">--:--</div></div>
            </div>
            <h1>PHUKET</h1>
            <p>MARCH 5 — MARCH 17, 2026</p>
            <div class="countdown">
                <div class="countdown-timer" id="countdown">Loading...</div>
            </div>
        </div>

        <div class="container">
            <div class="main-list" id="itinerary-list">
                <div class="loading">Fetching itinerary...</div>
            </div>
        </div>
    </div>

    <div id="checklist-page" style="display: none; padding-top: 40px;">
        <div class="container" style="margin-top: 0;">
            <h2 style="text-align: center; color: var(--primary);">Packing List</h2>
            <div class="main-list" id="checklist-content">
                <div class="loading">Fetching checklists...</div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-btn active" id="btn-itinerary" onclick="showPage('itinerary')">
            <i class="fas fa-map-marked-alt"></i><span>Itinerary</span>
        </button>
        <button class="nav-btn" id="btn-checklist" onclick="showPage('checklist')">
            <i class="fas fa-check-double"></i><span>Checklists</span>
        </button>
    </nav>

    <script>
        // --- 1. CONFIGURATION: PASTE YOUR CSV LINKS HERE ---
      // --- 1. CONFIGURATION: PASTE YOUR UNIQUE TAB LINKS HERE ---
const itinerarySheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS_CnsbDUPOjrATctJ5byGVkKLOrjBuv3mwvMVcaLVKI03faBrL7GOHMX3a8n5SzMfLrgrtrZoIB-xG/pub?gid=0&single=true&output=csv';
const checklistSheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS_CnsbDUPOjrATctJ5byGVkKLOrjBuv3mwvMVcaLVKI03faBrL7GOHMX3a8n5SzMfLrgrtrZoIB-xG/pub?gid=1402744317&single=true&output=csv';

        // --- 2. NAVIGATION LOGIC ---
        function showPage(page) {
            document.getElementById('itinerary-page').style.display = page === 'itinerary' ? 'block' : 'none';
            document.getElementById('checklist-page').style.display = page === 'checklist' ? 'block' : 'none';
            document.getElementById('btn-itinerary').classList.toggle('active', page === 'itinerary');
            document.getElementById('btn-checklist').classList.toggle('active', page === 'checklist');
            if(page === 'checklist') fetchChecklist();
        }

        // --- 3. DATA FETCHING ---
        async function fetchItinerary() {
            try {
                const response = await fetch(itinerarySheetUrl);
                const data = await response.text();
                const rows = data.split(/\r?\n/).slice(1);
                const list = document.getElementById('itinerary-list');
                list.innerHTML = '';

                rows.forEach(row => {
                    const col = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/"/g, '').trim());
                    if (col.length < 5) return;

                    const [day, month, icon, title, desc, price, link] = col;
                    const formattedDesc = desc.split(/[;\n]/).map(l => `<p>${l.trim()}</p>`).join('');
                    const titleContent = link ? `<a href="${link}" target="_blank" style="color:inherit;text-decoration:none">${title} <i class="fas fa-external-link-alt" style="font-size:0.7rem"></i></a>` : title;

                    list.innerHTML += `
                        <div class="list-item">
                            <div class="date-box"><span class="day">${day}</span><span class="month">${month}</span></div>
                            <div class="activity-details">
                                <h4><i class="fas ${icon}"></i> ${titleContent}</h4>
                                ${formattedDesc}
                            </div>
                            ${price ? `<div class="price-tag ${price.toLowerCase()==='open'?'free-tag':''}">${price}</div>` : ''}
                        </div>`;
                });
            } catch (e) { console.error(e); }
        }

        async function fetchChecklist() {
            try {
                const response = await fetch(checklistSheetUrl);
                const data = await response.text();
                const rows = data.split(/\r?\n/).slice(1);
                const list = document.getElementById('checklist-content');
                
                let html = `<div class="check-grid check-header"><div>Item</div><div>Dad</div><div>Mom</div><div>Srh</div><div>Soph</div></div>`;
                
                rows.forEach(row => {
                    const col = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/"/g, '').trim());
                    if (col.length < 5) return;
                    const getIcon = (v) => v.toUpperCase() === 'TRUE' ? '<i class="fas fa-check-circle"></i>' : '<i class="far fa-circle"></i>';
                    
                    html += `<div class="check-grid">
                        <div style="font-weight:500">${col[0]}</div>
                        <div class="status-icon">${getIcon(col[1])}</div>
                        <div class="status-icon">${getIcon(col[2])}</div>
                        <div class="status-icon">${getIcon(col[3])}</div>
                        <div class="status-icon">${getIcon(col[4])}</div>
                    </div>`;
                });
                list.innerHTML = html;
            } catch (e) { console.error(e); }
        }

        // --- 4. CLOCKS & COUNTDOWN ---
        function updateClocks() {
            const now = new Date();
            const fmt = (tz) => now.toLocaleTimeString('en-US', { timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: true });
            document.getElementById("time-knox").innerText = fmt('America/New_York');
            document.getElementById("time-doha").innerText = fmt('Asia/Qatar');
            document.getElementById("time-phuket").innerText = fmt('Asia/Bangkok');

            const target = new Date("2026-03-05T00:00:00").getTime();
            const dist = target - now.getTime();
            if (dist < 0) { document.getElementById("countdown").innerText = "Enjoy Thailand!"; return; }
            const d = Math.floor(dist / 86400000), h = Math.floor((dist % 86400000) / 3600000), m = Math.floor((dist % 3600000) / 60000);
            document.getElementById("countdown").innerText = `${d}d ${h}h ${m}m`;
        }

        setInterval(updateClocks, 1000);
        updateClocks();
        fetchItinerary();
    </script>
</body>
</html>
